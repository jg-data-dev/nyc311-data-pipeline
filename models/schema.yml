version: 2

models:
  - name: stg_311_requests
    description: "Cleaned source-shaped NYC 311 requests. Grain: one row per raw 311 unique_key."
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: created_date
        tests:
          - not_null
      - name: location_key
        description: "Deterministic hash of normalized location attributes used to build dim_location."
      - name: borough
        description: Cleaned borough value. Nulls and blanks should be converted to UNSPECIFIED.
        tests:
          - not_null
          - accepted_values:
              values:
                - STATEN ISLAND
                - BRONX
                - MANHATTAN
                - UNSPECIFIED
                - BROOKLYN
                - QUEENS

  - name: dim_date
    description: "Date dimension built from created, closed, and resolution-action dates found in staged 311 requests. Grain: one row per calendar date."
    columns:
      - name: date_id
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique

  - name: dim_location
    description: "Location dimension derived from normalized 311 address/location fields. Grain: one row per location_key."
    columns:
      - name: location_id
        tests:
          - not_null
          - unique
      - name: location_key
        tests:
          - not_null
          - unique

  - name: dim_agency
    description: "Agency dimension. Grain: one row per normalized agency and agency_name pair."
    columns:
      - name: agency_id
        tests:
          - not_null
          - unique
    tests:
      - unique_composite_key:
          columns:
            - agency
            - agency_name
    

  - name: dim_complaint_type
    description: "Complaint type dimension. Grain: one row per complaint_type, descriptor, and descriptor_2 combination."
    columns:
      - name: complaint_type_id
        tests:
          - not_null
          - unique
    tests:
      - unique_composite_key:
          columns:
            - complaint_type
            - descriptor
            - descriptor_2

  - name: dim_status
    description: "Status dimension. Grain: one row per normalized status."
    columns:
      - name: status_id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - not_null
          - unique

  - name: dim_channel
    description: "Open Data channel dimension. Grain: one row per normalized open_data_channel_type."
    columns:
      - name: channel_id
        tests:
          - not_null
          - unique
      - name: open_data_channel_type
        tests:
          - not_null
          - unique

  - name: fct_311_complaint
    description: "Atomic 311 complaint fact table. Grain: one row per 311 complaint unique_key."
    columns:
      - name: complaint_key
        tests:
          - not_null
          - unique
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: created_date_id
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: closed_date_id
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: resolution_action_date_id
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: location_id
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: agency_id
        tests:
          - relationships:
              to: ref('dim_agency')
              field: agency_id
      - name: complaint_type_id
        tests:
          - relationships:
              to: ref('dim_complaint_type')
              field: complaint_type_id
      - name: status_id
        tests:
          - relationships:
              to: ref('dim_status')
              field: status_id
      - name: channel_id
        tests:
          - relationships:
              to: ref('dim_channel')
              field: channel_id

  - name: fct_311_complaint_text
    description: "Long-text fact extension for 311 complaint resolution descriptions. Grain: one row per unique_key."
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_311_complaint')
              field: unique_key

  - name: int_complaints_flagged
    description: "Reusable intermediate model that adds validity, missing-field, and status/date consistency flags to the atomic complaint fact. Grain: one row per unique_key."
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: created_at
        tests:
          - not_null

  - name: fct_daily_metrics
    description: "Derived daily aggregate metrics. Grain: one row per metric_date. Created counts use created_at; closed counts and resolution metrics use closed_at for valid closed complaints."
    columns:
      - name: metric_date
        tests:
          - not_null
          - unique

  - name: fct_borough_complaint_mix
    description: >
      Derived complaint distribution by borough and complaint type across the loaded dataset.
      Grain: one row per borough and complaint_type.
      The composite key is borough + complaint_type.    
    columns:
      - name: borough
        tests:
          - not_null
      - name: complaint_type
        tests:
          - not_null
      - name: total_requests
        tests:
          - not_null
    tests:
      - unique_composite_key:
          columns:
            - borough
            - complaint_type
  
  - name: fct_monthly_metrics
    description: >
      Monthly aggregate metrics for 311 complaints. Grain: one row per metric month,
      based on complaint created month.
    columns:
      - name: month_start
        description: First day of the created month.
        tests:
          - unique
          - not_null

      - name: created_count
        tests:
          - not_null

      - name: closed_count
        tests:
          - not_null

      - name: net_case_flow
        tests:
          - not_null

      - name: invalid_time_order_count
        tests:
          - not_null

      - name: missing_critical_fields_count
        tests:
          - not_null

      - name: missing_location_id_count
        tests:
          - not_null

      - name: missing_complaint_type_id_count
        tests:
          - not_null

      - name: missing_agency_id_count
        tests:
          - not_null

      - name: missing_status_id_count
        tests:
          - not_null

      - name: closed_at_status_mismatch_count
        tests:
          - not_null